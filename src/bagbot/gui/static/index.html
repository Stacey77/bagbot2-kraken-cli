<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BagBot Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0a101c; --panel: #101a2b; --panel2: #152238; --border: #1e3352;
    --text: #d7e3f4; --muted: #6b80a0; --accent: #3ec1f3; --cyan: #29d3da;
    --green: #2fbf71; --red: #e5484d; --yellow: #f5a623;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; padding: 18px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header h1 { font-size: 20px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge.dry { background: rgba(245,166,35,.15); color: var(--yellow); border: 1px solid var(--yellow); }
  .badge.live { background: rgba(229,72,77,.15); color: var(--red); border: 1px solid var(--red); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .big { font-size: 28px; font-weight: 700; color: var(--cyan); }
  .muted { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  canvas { width: 100%; height: 160px; }
  .alert { padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
  .alert.info { background: rgba(62,193,243,.12); color: var(--accent); }
  .alert.warning { background: rgba(245,166,35,.12); color: var(--yellow); }
  .buy { color: var(--green); } .sell { color: var(--red); }
</style>
</head>
<body>
<header>
  <h1>&#9889; Bag<span>Bot</span></h1>
  <span id="mode" class="badge dry">?</span>
  <span class="muted" id="uptime"></span>
</header>
<div class="grid">
  <div class="card">
    <h2>Market Data</h2>
    <div class="big" id="last">?</div>
    <div class="muted" id="pair"></div>
    <table>
      <tr><th>Bid</th><th>Ask</th><th>Vol 24h</th></tr>
      <tr><td id="bid">?</td><td id="ask">?</td><td id="vol">?</td></tr>
    </table>
  </div>
  <div class="card">
    <h2>Price Chart (live poll)</h2>
    <canvas id="chart" width="600" height="160"></canvas>
  </div>
  <div class="card">
    <h2>Portfolio</h2>
    <div id="portfolio" class="muted">loading?</div>
  </div>
  <div class="card">
    <h2>Open Orders</h2>
    <div id="orders" class="muted">loading?</div>
  </div>
  <div class="card">
    <h2>System Alerts</h2>
    <div id="alerts"></div>
  </div>
</div>
<script>
const prices = [];
async function j(path) { const r = await fetch(path); return r.json(); }

function draw() {
  const c = document.getElementById("chart"), ctx = c.getContext("2d");
  ctx.clearRect(0, 0, c.width, c.height);
  if (prices.length < 2) return;
  const min = Math.min(...prices), max = Math.max(...prices), span = (max - min) || 1;
  ctx.strokeStyle = "#29d3da"; ctx.lineWidth = 2; ctx.beginPath();
  prices.forEach((p, i) => {
    const x = i / (prices.length - 1) * (c.width - 10) + 5;
    const y = c.height - 8 - (p - min) / span * (c.height - 16);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
}

async function refresh() {
  try {
    const s = await j("/api/status");
    const m = document.getElementById("mode");
    m.textContent = s.mode.toUpperCase(); m.className = "badge " + (s.dry_run ? "dry" : "live");
    document.getElementById("uptime").textContent = "uptime " + s.uptime_seconds + "s";

    const mk = await j("/api/market");
    if (!mk.error) {
      document.getElementById("last").textContent = mk.last.toLocaleString();
      document.getElementById("pair").textContent = mk.pair;
      document.getElementById("bid").textContent = mk.bid;
      document.getElementById("ask").textContent = mk.ask;
      document.getElementById("vol").textContent = mk.volume_24h;
      prices.push(mk.last); if (prices.length > 120) prices.shift(); draw();
    }

    const pf = await j("/api/portfolio");
    const bal = Object.entries(pf.balances || {});
    document.getElementById("portfolio").innerHTML =
      (bal.length ? "<table>" + bal.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("") + "</table>" : "")
      + (pf.note ? `<div class="muted">${pf.note}</div>` : "");

    const od = await j("/api/orders");
    const entries = Object.entries(od || {});
    document.getElementById("orders").innerHTML = entries.length
      ? "<table><tr><th>txid</th><th>side</th><th>vol</th><th>type</th></tr>" +
        entries.map(([id, o]) => `<tr><td>${id}</td><td class="${o.type}">${o.type || ""}</td><td>${o.vol || ""}</td><td>${o.ordertype || ""}</td></tr>`).join("") + "</table>"
      : '<span class="muted">no open orders</span>';

    const al = await j("/api/alerts");
    document.getElementById("alerts").innerHTML =
      al.map(a => `<div class="alert ${a.level}">${a.text}</div>`).join("");
  } catch (e) { /* server unreachable - keep last state */ }
}
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
